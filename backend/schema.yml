openapi: 3.0.3
info:
  title: HOREMOW REST API
  version: 1.0.0
  description: Authoritative backend for Holiness Revival Movement Worldwide public
    site and admin portal.
paths:
  /api/v1/audit/:
    get:
      operationId: audit_list
      description: |-
        Read-only audit log endpoint for security and compliance audits.
        Strictly limited to SuperAdmin.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit/{id}/:
    get:
      operationId: audit_retrieve
      description: |-
        Read-only audit log endpoint for security and compliance audits.
        Strictly limited to SuperAdmin.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Audit Log Entry.
        required: true
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
